<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typeKey - Typing Test</title>
    <link href="css/style.css" rel="stylesheet">
    <script src="js/typeKey.js" defer></script>
</head>
<body class="min-h-screen bg-zinc-900 text-white">
    <main class="mx-auto flex min-h-screen max-w-5xl flex-col px-6 py-8">
        <header class="mb-16 flex items-center justify-between border-b border-zinc-800 pb-5">
            <h1 class="text-lg font-semibold tracking-tight text-zinc-100">typeKey</h1>

            <div class="flex items-center gap-8">
                <button
                    id="theme-toggle"
                    class="theme-toggle rounded-md border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 transition-colors hover:border-zinc-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-zinc-400"
                    type="button"
                    aria-label="Switch to light mode"
                >
                    Light mode
                </button>
            </div>
        </header>

        <section class="flex flex-1 flex-col items-center justify-center">
            <div class="mb-8 flex flex-col items-center gap-3 font-mono text-sm">
                <div class="flex items-center gap-2">
                    <button id="quote-mode-button" class="mode-button rounded-md border border-zinc-700 px-3 py-1.5 text-zinc-300 transition-colors hover:border-zinc-500 hover:text-white" type="button">
                        Quote Mode
                    </button>
                    <button id="time-mode-button" class="mode-button rounded-md border border-zinc-700 px-3 py-1.5 text-zinc-300 transition-colors hover:border-zinc-500 hover:text-white" type="button">
                        Time Mode
                    </button>
                </div>
                <div id="time-options" class="hidden items-center gap-2">
                    <button class="time-button rounded-md border border-zinc-700 px-3 py-1 text-zinc-400 transition-colors hover:border-zinc-500 hover:text-white" type="button" data-time-limit="15">15s</button>
                    <button class="time-button rounded-md border border-zinc-700 px-3 py-1 text-zinc-400 transition-colors hover:border-zinc-500 hover:text-white" type="button" data-time-limit="30">30s</button>
                    <button class="time-button rounded-md border border-zinc-700 px-3 py-1 text-zinc-400 transition-colors hover:border-zinc-500 hover:text-white" type="button" data-time-limit="60">60s</button>
                </div>
                <span id="timer-display" class="text-zinc-500" aria-live="polite">Quote</span>
            </div>

            <div class="w-full max-w-4xl">
                <p id="text-display" class="text-display mx-auto w-full max-w-4xl font-mono text-xl leading-relaxed text-zinc-400" aria-live="polite"></p>
            </div>

            <input
                id="typing-input"
                class="sr-only typing-input"
                type="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="Type the displayed text"
            >

            <button
                id="restart-button"
                class="mt-12 rounded-lg border border-zinc-700 px-5 py-2 text-sm text-zinc-300 transition-colors hover:border-zinc-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-zinc-400"
                type="button"
            >
                Restart
            </button>
        </section>
    </main>
</body>
</html>
