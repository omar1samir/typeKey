<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typeKey - Results</title>
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/typKey-logo-transperant.png">
    <script src="js/stats.js" defer></script>
</head>
<body class="min-h-screen bg-zinc-900 font-mono text-white">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col px-6 py-8">
        <header class="mb-16 flex items-center justify-between border-b border-zinc-800 pb-5">
            <h1 class="h-9 w-32" aria-label="typeKey">
                <svg class="typekey-logo-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%" role="img" aria-labelledby="typekey-logo-title">
                    <title id="typekey-logo-title">typeKey</title>
                    <defs>
                        <filter id="typekey-glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
                            <feMerge>
                                <feMergeNode in="coloredBlur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <style>
                        .typekey-typed { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Monaco, Consolas, monospace; font-size: 40px; font-weight: 700; fill: #e6edf3; letter-spacing: -1px; }
                        .typekey-untyped { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Monaco, Consolas, monospace; font-size: 40px; font-weight: 700; fill: #4b5563; letter-spacing: -1px; }
                        .typekey-ibeam { stroke: rgb(0, 163, 220); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
                    </style>
                    <text x="12" y="48" class="typekey-typed">type</text>
                    <g filter="url(#typekey-glow)">
                        <line x1="126" y1="17" x2="126" y2="53" class="typekey-ibeam" />
                        <path d="M 119 17 Q 126 19 133 17" class="typekey-ibeam" fill="none" />
                        <line x1="122.5" y1="35" x2="129.5" y2="35" class="typekey-ibeam" />
                        <path d="M 119 53 Q 126 51 133 53" class="typekey-ibeam" fill="none" />
                    </g>
                    <text x="138" y="48" class="typekey-untyped">Key</text>
                </svg>
                <svg class="typekey-logo-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%" role="img" aria-labelledby="typekey-logo-title-light">
                    <title id="typekey-logo-title-light">typeKey</title>
                    <defs>
                        <filter id="typekey-glow-light" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur" />
                            <feMerge>
                                <feMergeNode in="coloredBlur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <style>
                        .typekey-typed-light { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Monaco, Consolas, monospace; font-size: 40px; font-weight: 700; fill: #18181b; letter-spacing: -1px; }
                        .typekey-untyped-light { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Monaco, Consolas, monospace; font-size: 40px; font-weight: 700; fill: #a1a1aa; letter-spacing: -1px; }
                        .typekey-ibeam-light { stroke: rgb(0, 163, 220); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
                    </style>
                    <text x="12" y="48" class="typekey-typed-light">type</text>
                    <g filter="url(#typekey-glow-light)">
                        <line x1="126" y1="17" x2="126" y2="53" class="typekey-ibeam-light" />
                        <path d="M 119 17 Q 126 19 133 17" class="typekey-ibeam-light" fill="none" />
                        <line x1="122.5" y1="35" x2="129.5" y2="35" class="typekey-ibeam-light" />
                        <path d="M 119 53 Q 126 51 133 53" class="typekey-ibeam-light" fill="none" />
                    </g>
                    <text x="138" y="48" class="typekey-untyped-light">Key</text>
                </svg>
            </h1>
            <button
                id="theme-toggle"
                class="theme-toggle rounded-md border border-zinc-700 px-3 py-1.5 text-xs text-zinc-300 transition-colors hover:border-zinc-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-zinc-400"
                type="button"
                aria-label="Switch to light mode"
            >
                Light mode
            </button>
        </header>

        <section class="flex flex-1 flex-col items-center justify-center pb-12">
            <div class="flex flex-col gap-12 sm:flex-row sm:items-center sm:gap-32">
                <div>
                    <p class="text-sm uppercase tracking-widest text-zinc-500">WPM</p>
                    <p id="wpm" class="mt-2 text-7xl font-bold leading-none text-green-400">0</p>
                    <p class="mt-10 text-sm uppercase tracking-widest text-zinc-500">Accuracy</p>
                    <p id="accuracy" class="mt-2 text-5xl font-bold leading-none text-blue-400">0%</p>
                </div>

                <div class="pt-8 text-left sm:pt-10">
                    <dl class="space-y-6">
                        <div>
                            <dt class="text-xs uppercase tracking-widest text-zinc-500">Time</dt>
                            <dd id="time" class="mt-1 text-2xl text-zinc-200">0s</dd>
                        </div>
                        <div>
                            <dt class="text-xs uppercase tracking-widest text-zinc-500">Characters typed</dt>
                            <dd id="total-typed" class="mt-1 text-2xl text-zinc-200">0</dd>
                        </div>
                    </dl>

                    <p class="mt-10 text-sm text-zinc-400">
                        characters
                        <span
                            id="correct-count"
                            class="text-green-500"
                            title="Correct: typed correctly on the first try"
                            aria-label="Correct characters"
                        >0</span>
                        /
                        <span
                            id="incorrect-count"
                            class="text-red-500"
                            title="Incorrect: typed incorrectly"
                            aria-label="Incorrect characters"
                        >0</span>
                        /
                        <span
                            id="corrected-count"
                            class="text-yellow-500"
                            title="Corrected: fixed after an incorrect attempt"
                            aria-label="Corrected characters"
                        >0</span>
                    </p>
                </div>
            </div>

            <a
                class="mt-10 w-fit rounded-md border border-zinc-700 px-4 py-2 text-sm text-zinc-300 transition-colors hover:border-zinc-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-zinc-400"
                href="index.html"
            >Try Again</a>

            <div class="mt-12 text-center text-sm text-zinc-500">
                <p>
                    Good work, want to get faster?
                    <a
                        class="ml-1 inline-block rounded-md border border-zinc-700 px-3 py-1 text-zinc-300 transition-colors hover:border-zinc-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-zinc-400"
                        href="tips.html"
                    >Explore typing tips</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
